<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
		 <nav class="navbar navbar-light bg-light">
            <a class="navbar-brand" href="/">
                <img src="https://img.icons8.com/ios-filled/50/000000/home.png" alt="Inicio" width="30" height="30">
            </a>
        </nav>
        <h1 class="text-center my-5">Catálogo de Productos</h1>

        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/productos/add}" class="btn btn-primary">Añadir producto</a>
        </div>

        <div class="mb-4">
            <a href="/cart" class="btn btn-secondary">Ver Carrito</a>
        </div>

        <form th:action="@{/productos}" method="get" class="mb-4">
            <div class="row g-2">
                <div class="col-md-4">
                    <input type="text" name="name" class="form-control" placeholder="Buscar producto">
                </div>

                <div class="col-md-3">
                    <input type="number" step="0.01" name="minPrice" class="form-control" placeholder="Precio mínimo">
                </div>

                <div class="col-md-3">
                    <input type="number" step="0.01" name="maxPrice" placeholder="Precio máximo">
                </div>

                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Filtrar</button>
                </div>
            </div>
        </form>

        <a href="/productos" class="btn btn-secondary">Limpiar filtros</a>

        <div class="row">
            <div th:each="product : ${products}" class="col-md-4">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${product.name}">Nombre del Producto</h5>
                        <p class="card-text" th:text="${product.price}">Precio</p>
                        <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-primary">Agregar al Carrito</button>
                        </form>
                        <div sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/productos/edit/{id}(id=${product.id})}" class="btn btn-warning">Editar</a>
                            <form th:action="@{/productos/delete/{id}(id=${product.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-danger">Eliminar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
